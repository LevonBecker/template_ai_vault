[project]
name = "template-ai-vault"
dynamic = ["version"]  # read from the VERSION file (see [tool.setuptools.dynamic])
description = "A local-first AI research workspace for VS Code — every conversation and doc lives in one git-tracked repo, so you can freely switch between AI providers and models while syncing the same context across all your devices."
readme = "README.md"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Linux BASH"
]
requires-python = ">=3.14"
dependencies = [
    "fireball_sidecar_toolkit @ git+https://github.com/fireballenterprise/fireball_sidecar_toolkit@development",
    "actionlint-py~=1.7.12.24",
    "invoke~=3.0.3",
    "pylint~=4.0.8",
    "pytest~=9.1.1",
    "pytest-cov~=7.1.0",
    "pyyaml~=6.0.3",
    "ruff~=0.16.6",
    "yamllint~=1.38.0",
    "tomlkit~=0.15.1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[project.urls]
homepage = "https://github.com/LevonBecker/template_ai_vault"
repository = "https://github.com/LevonBecker/template_ai_vault"

[tool.ruff]
line-length = 120
target-version = "py314"
# modules/toolkit/** + tasks/toolkit/** are clobbered from fireball_sidecar_toolkit — the toolkit's
# own CI lints that code; sidecar.toolkit.check gates drift here.
extend-exclude = ["topics/*", "tests/*", "modules/toolkit/*", "tasks/toolkit/*"]

[tool.ruff.lint]
select = ["PL", "E", "W", "F", "I", "B", "A", "C4", "N", "UP", "T10", "EXE", "COM819", "C", "Q"]

ignore = ["E501", "PLR2004"]

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.mccabe]
max-complexity = 20 # 5 = default, 12 = previous

[tool.ruff.lint.pylint]
max-branches = 20 # default = 12, previous = 15
max-args = 15 # default = 5
max-statements = 75 # default = 50
max-returns = 10 # default = 6
max-nested-blocks = 10 # default = 5

[tool.ruff.lint.per-file-ignores]


[tool.ruff.format]
exclude = ["topics/*"]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tmp", ".venv", ".ruff_cache", "__pycache__"]
markers = [
    "common: modules/toolkit/common/ helpers — tests/toolkit/common/",
    "drift: gate tests that catch a forgotten regen step before merge — tests/toolkit/drift/",
    "repo: modules/toolkit/repo/ (git/PR ops + repo-family fan-out) — tests/toolkit/repo/",
    "setup: modules/toolkit/setup/ (properties.yml bootstrap) — tests/toolkit/setup/",
    "style: Markdown/doc style checks — tests/toolkit/style/",
    "topic: modules/toolkit/topic/ (topic workspace management) — tests/toolkit/topic/",
    "versioning: modules/toolkit/versioning/ (dependency/toolchain version checks) — tests/toolkit/versioning/",
    "backlog: modules/toolkit/backlog/ (GitHub Issues bug/feature/task tracker) — tests/toolkit/backlog/",
]

[tool.pylint.main]
py-version = "3.14"
fail-under = 10
ignore = ["CVS"]
ignore-paths = [
  "^env/.*$",
  "^.venv/.*$",
  "^venv/.*$",
  "^.ruff_cache/.*$",
  "^tmp/.*$",
  "^topics/.*$",
  "^tests/.*$",
  "^modules/toolkit/.*$",
  "^tasks/toolkit/.*$",
  ".*__pycache__.*$",
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.messages_control]
disable = ["all"]
enable = ["no-member"]

[tool.pylint.design]
max-args = 15
max-branches = 20
max-locals = 20
max-positional-arguments = 15
max-public-methods = 20
max-returns = 10
max-statements = 75

[tool.pylint.refactoring]
max-nested-blocks = 10
