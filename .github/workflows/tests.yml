---
name: Tests
run-name: "Tests (${{ github.head_ref || github.ref_name }})"

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup CICD
        uses: ./.github/actions/cicd_setup

      - name: invoke test
        run: |
          source .venv/bin/activate
          invoke debug.env
          invoke test
